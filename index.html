<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEVEN7 — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root { --bg:#030305; --bg-elevated:#0a0a10; --bg-card:rgba(255,255,255,0.02); --text:#f5f5fa; --text-secondary:#9a9aaa; --text-muted:#4a4a55; --accent:#ff6b00; --accent-secondary:#00d4ff; --accent-tertiary:#ff0055; --border:rgba(255,255,255,0.05); --border-hover:rgba(255,107,0,0.3); }
* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; }
body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; overflow-x:hidden; }

/* INTRO SPLASH */
#intro-splash { position:fixed; inset:0; background:#000; z-index:99999; display:flex; flex-direction:column; align-items:center; justify-content:center; transition:opacity 1.2s cubic-bezier(0.4,0,0.2,1), visibility 1.2s; }
#intro-splash.hidden { opacity:0; visibility:hidden; pointer-events:none; }
.intro-logo { font-size:clamp(60px,15vw,140px); font-weight:900; letter-spacing:12px; color:#fff; position:relative; text-shadow: 0 0 20px rgba(255,107,0,0.5), 0 0 40px rgba(255,107,0,0.3), 0 0 80px rgba(255,107,0,0.2), 0 0 120px rgba(255,0,85,0.15); animation:introPulse 2s ease-in-out infinite; }
.intro-logo span { color:var(--accent); text-shadow: 0 0 20px rgba(255,107,0,0.8), 0 0 40px rgba(255,107,0,0.5), 0 0 80px rgba(255,107,0,0.3); }
@keyframes introPulse { 0%,100%{transform:scale(1);filter:brightness(1);} 50%{transform:scale(1.02);filter:brightness(1.2);} }
.intro-glitch { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:clamp(60px,15vw,140px); font-weight:900; letter-spacing:12px; color:var(--accent-secondary); opacity:0; animation:glitchAnim 0.3s ease 0.8s forwards; text-shadow:0 0 30px rgba(0,212,255,0.6); }
.intro-glitch::before { content:'SEVEN7'; position:absolute; left:-3px; color:var(--accent-tertiary); clip-path:inset(0 0 50% 0); animation:glitchTop 0.4s ease 1s forwards; opacity:0; }
.intro-glitch::after { content:'SEVEN7'; position:absolute; left:3px; color:var(--accent); clip-path:inset(50% 0 0 0); animation:glitchBot 0.4s ease 1.1s forwards; opacity:0; }
@keyframes glitchAnim { 0%{opacity:0;transform:translateX(-20px);} 20%{opacity:1;transform:translateX(10px);} 40%{opacity:0;transform:translateX(-5px);} 60%{opacity:1;transform:translateX(5px);} 80%{opacity:0;transform:translateX(-2px);} 100%{opacity:0;transform:translateX(0);} }
@keyframes glitchTop { 0%{opacity:0;} 50%{opacity:0.8;} 100%{opacity:0;} }
@keyframes glitchBot { 0%{opacity:0;} 50%{opacity:0.8;} 100%{opacity:0;} }
.intro-sub { margin-top:24px; font-size:14px; color:var(--text-muted); letter-spacing:8px; text-transform:uppercase; font-weight:600; opacity:0; animation:fadeInUp 1s ease 1.5s forwards; }
.intro-bar { width:120px; height:2px; background:linear-gradient(90deg,var(--accent),var(--accent-secondary)); margin-top:32px; border-radius:2px; transform:scaleX(0); animation:barGrow 1.5s ease 1.8s forwards; }
@keyframes barGrow { to{transform:scaleX(1);} }
@keyframes fadeInUp { from{opacity:0;transform:translateY(20px);} to{opacity:1;transform:translateY(0);} }

/* BACKGROUND */
.bg-grid { position:fixed; inset:0; background-image: linear-gradient(rgba(255,107,0,0.03) 1px,transparent 1px), linear-gradient(90deg,rgba(255,107,0,0.03) 1px,transparent 1px); background-size:80px 80px; pointer-events:none; z-index:0; mask-image:radial-gradient(ellipse at center,black 20%,transparent 70%); }
.bg-orb { position:fixed; border-radius:50%; filter:blur(120px); pointer-events:none; z-index:0; opacity:0.3; }
.orb-1 { width:600px; height:600px; background:var(--accent); top:-15%; left:-10%; animation:float 15s ease-in-out infinite; }
